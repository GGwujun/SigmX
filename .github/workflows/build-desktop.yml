name: Build Desktop Installer

on:
  push:
    tags:
      - "v*"          # v0.1.0, v0.2.0 ...
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ---- Python backend (PyInstaller) ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install -e .
          pip install pyinstaller

      # ---- Frontend ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      # ---- PyInstaller bundle ----
      - name: Run PyInstaller
        run: pyinstaller vibe-trading.spec

      - name: Copy bundle to desktop
        run: |
          mkdir -p desktop\python-dist
          xcopy /E /I dist\vibe-trading desktop\python-dist\vibe-trading

      # ---- Electron builder ----
      - name: Install Electron deps
        run: |
          cd desktop
          npm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build NSIS installer
        run: |
          cd desktop
          npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Upload artifact ----
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SigmX-Setup
          path: desktop\release\SigmX-Setup-*.exe

      # ---- GitHub Release (tag push only) ----
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop\release\SigmX-Setup-*.exe
          generate_release_notes: true
