name: Build Desktop Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # required for GitHub Release upload

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            executable: vibe-trading.exe
            artifact: SigmX-Windows
          - os: macos-14
            platform: mac
            executable: vibe-trading
            artifact: SigmX-macOS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # use bash for all steps (mkdir -p, cd, etc.)

    steps:
      - uses: actions/checkout@v4

      # ---- Python ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install -e .
          pip install pyinstaller

      # ---- Frontend ----
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # ---- PyInstaller ----
      - name: Build Python bundle
        run: pyinstaller vibe-trading.spec

      - name: Copy bundle to desktop/
        run: |
          rm -rf desktop/python-dist
          mkdir -p desktop/python-dist
          cp -R dist/vibe-trading desktop/python-dist/vibe-trading
          ls "desktop/python-dist/vibe-trading/${{ matrix.executable }}"

      # ---- Electron ----
      - name: Install Electron deps
        working-directory: desktop
        run: npm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build Desktop installer
        working-directory: desktop
        run: npx electron-builder --${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # ---- Upload ----
      - name: Upload Windows installer artifact
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/release/SigmX-Setup-*.exe

      - name: Upload macOS installer artifact
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/release/SigmX-*-mac-*.dmg

      - name: Attach Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'win'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/SigmX-Setup-*.exe
            desktop/release/latest.yml
            desktop/release/SigmX-Setup-*.exe.blockmap
          generate_release_notes: true

      - name: Attach macOS installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/SigmX-*-mac-*.dmg
            desktop/release/latest-mac.yml
          generate_release_notes: true
