name: Build Desktop Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # use bash for all steps (mkdir -p, cd, etc.)

    steps:
      - uses: actions/checkout@v4

      # ---- Python ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install -e .
          pip install pyinstaller

      # ---- Frontend ----
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # ---- PyInstaller ----
      - name: Build Python bundle
        run: pyinstaller vibe-trading.spec

      - name: Copy bundle to desktop/
        run: |
          rm -rf desktop/python-dist
          mkdir -p desktop/python-dist
          cp -R dist/vibe-trading desktop/python-dist/vibe-trading
          ls desktop/python-dist/vibe-trading/vibe-trading.exe

      # ---- Electron ----
      - name: Install Electron deps
        working-directory: desktop
        run: npm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build NSIS installer
        working-directory: desktop
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # ---- Upload ----
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SigmX-Setup
          path: desktop/release/SigmX-Setup-*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/SigmX-Setup-*.exe
          generate_release_notes: true
