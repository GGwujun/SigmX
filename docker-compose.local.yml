# 本地部署覆盖配置
# 用法：docker-compose -f docker-compose.yml -f docker-compose.local.yml up
# 数据目录：E:\gwj\sigmx-local\data（与代码分离）

services:
  # 数据推送服务（本地 → 服务器）
  data-sync:
    build: ./data-sync
    container_name: sigmx-data-sync
    restart: unless-stopped
    volumes:
      - E:\gwj\sigmx-local\data:/data:rw
    environment:
      - TZ=Asia/Shanghai
      - DB_PATH=/data/market.db
      - SERVER_URL=${MARKET_INGEST_URL:-https://sigmx.dsx-family.site/market-ingest}
      - MARKET_INGEST_TOKEN=${MARKET_INGEST_TOKEN:-}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-30}
      - SNAPSHOT_PUSH_SLOTS=${SNAPSHOT_PUSH_SLOTS:-09:26,14:29,15:20}
      # Persist sender-state.json inside the mounted /data so it survives
      # container restarts (otherwise the last-delivered run is forgotten and
      # only the latest run is re-delivered after a restart).
      - SNAPSHOT_WORK_DIR=/data/sync-state
    # Health: the loop writes to /data/sync.log at least once per heartbeat
    # interval (~60s). If the log has not been touched in 10 minutes the
    # process is almost certainly frozen (e.g. stuck in a sqlite backup).
    healthcheck:
      test:
        - "CMD-SHELL"
        - "find /data/sync.log -mmin -10 | grep -q sync.log || exit 1"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: 256m
    mem_reservation: 128m

  # Dedicated local fetch/quality worker. It shares the exact same database
  # directory with data-sync; the production query host does not run this.
  market-sync:
    profiles: []
    volumes:
      - E:\gwj\sigmx-local\data:/home/vibe/.vibe-trading

  # 本地 Web 服务（端口 8900，包含查询 API /api/v1/*）
  vibe-trading:
    ports:
      - "8900:8900"
    volumes:
      - E:\gwj\sigmx-local\data:/data:ro
    environment:
      - TZ=Asia/Shanghai
      - DB_PATH=/data/market.db
      - VIBE_TRADING_TRUST_DOCKER_LOOPBACK=1

volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:\gwj\sigmx-local\data
