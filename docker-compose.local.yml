# 本地部署覆盖配置（单进程客户端模式）
# 用法：docker-compose -f docker-compose.yml -f docker-compose.local.yml --profile local up
# 数据目录：E:\gwj\sigmx-local\data（与代码分离）
#
# 客户端化后的本地拓扑：只有 vibe-trading 一个业务进程——它既服务 Web UI，
# 又在内置 daemon 线程里跑 market-sync worker（VIBE_TRADING_START_MARKET_SYNC_WORKER=1）。
# 不再有独立的 data-sync 推送服务和独立 market-sync 容器：本地就是数据源头，
# 不依赖远程服务器。远程只读查看改用 Cloudflare Tunnel（见 docs）。

services:
  # 唯一业务进程：Web UI + 内置 worker 拉数据（单进程客户端）
  vibe-trading:
    profiles: ["local"]
    ports:
      - "8900:8900"
    volumes:
      # 改为可写：内置 worker 要写 market.db（旧模式 vibe-trading 只读、独立 market-sync 写）
      - E:\gwj\sigmx-local\data:/home/vibe/.vibe-trading
    environment:
      - TZ=Asia/Shanghai
      - VIBE_TRADING_MARKET_DB_PATH=/home/vibe/.vibe-trading/market.db
      - VIBE_TRADING_TRUST_DOCKER_LOOPBACK=1
      # 客户端模式：loopback 免登录 + 内置 worker 拉数据
      - VIBE_TRADING_DESKTOP_MODE=1
      - VIBE_TRADING_START_MARKET_SYNC_WORKER=1
      - MARKET_SYNC_POSTCLOSE_UNIVERSE=all
      - MARKET_SYNC_POSTCLOSE_LOOKBACK_DAYS=365
    mem_limit: 1500m
    mem_reservation: 700m

  # RSSHub 仍在（新闻/电报聚合，可选）
  rsshub:
    profiles: ["local"]
    ports:
      - "11200:1200"

# 注：以下组件已在客户端化后移除
# - data-sync：本地→服务器快照推送。本地自包含后无服务器可推，纯死代码。
# - 独立 market-sync 容器：worker 现在在 vibe-trading 进程内跑（VIBE_TRADING_START_MARKET_SYNC_WORKER=1）。
# 若仍需"本地拉→推服务器"的旧双机模式，回退到 git 历史中的旧版 docker-compose.local.yml。
