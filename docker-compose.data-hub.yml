# Data Hub deployment — slim server-only image selling the market-data API.
#
# Production shape on the CN server (47.115.144.24): two containers only.
#   - vibe-trading : the /api/v1/* API + inline market-sync worker (server
#                   pulls A-share data itself via tushare, no local-push feed)
#                   behind nginx at https://sigmx.dsx-family.site
#   - rsshub       : financial news aggregation (RSS)
#
# No data-ingest container: the server self-pulls (START_MARKET_SYNC_WORKER=1),
# so the local→server data-sync push receiver is not needed. No frontend: nginx
# serves only /api/v1/* (the 26-page trading UI lives in the desktop client).
#
# Image: sigmx:data-hub (slim, ~466MB) built by Dockerfile.data-hub +
#        requirements-server.txt. The full sigmx:latest (1.69GB) is still
#        published by CI for other uses.
#
# Usage:
#   docker compose -f docker-compose.data-hub.yml up -d
# First API key: see docs — create via SubscriptionStore().create(...) in the
# container, or the admin API once a JWT admin user exists.

services:
  vibe-trading:
    image: crpi-i6pwsm2rbcu2h5uv.cn-shenzhen.personal.cr.aliyuncs.com/ggwujun/sigmx:data-hub
    ports:
      - "127.0.0.1:8899:8899"
    env_file:
      - agent/.env
    environment:
      - TZ=Asia/Shanghai
      - VIBE_TRADING_TRUST_DOCKER_LOOPBACK=1
      # Server self-pulls market data (tushare daily is reachable from CN cloud;
      # akshare/eastmoney push2 are blocked, those tables stay empty by design).
      - VIBE_TRADING_START_MARKET_SYNC_WORKER=1
      # Public API requires an API key for non-loopback requests.
      - VIBE_TRADING_DATA_HUB_MODE=1
      - RSSHUB_URL=http://rsshub:1200
    depends_on:
      - rsshub
    volumes:
      - data-hub-data:/home/vibe/.vibe-trading
      - ./agent/.env:/app/agent/.env:ro
    restart: unless-stopped
    mem_limit: 1200m
    mem_reservation: 600m

  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    expose:
      - "1200"

volumes:
  data-hub-data:
